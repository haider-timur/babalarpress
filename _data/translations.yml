  footer_text: "Через BABALAR PRESS, мы хотим создать пространство для наших казахстанских голосов, историй и опытов. Пространство для голосов наших далеких и близких, общих и личных бабалар. Пространство для тренировки наших голосовых мышц. Для осознания и признания ценности, красоты и силы наших голосов и историй. Пространство, чтобы документировать, экспериментировать и делиться нашими голосами."