  announcement: "Volume 1 is here and available for pre-order! Order a digital version or a Print + Digital bundle. For pricing click on the publication and check how it works."

  footer_text: "BALALAR PRESS арқылы дауыстарымыз, хикаяларымыз бен тәжірибелеріміз үшін орта құруды көздейміз. Біздің алыс және жақын ата-бабаларымыздың дауыстарын, әңгімелерін/хикаяларын және білімдерінe бағытталған орта. Дауыс желбезектерімізді жаттықтыратын орта. Үнімізді табу үшін, оны ашық түрде жеткізу үшін; хикаяларымыздың құндылығын, әдемілігін қабылдау үшін құрылған орта. Дауыстарымызды естіртіп, экспериментке салып, құжаттауға арналған орта."

